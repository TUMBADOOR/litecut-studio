# Compila los instaladores de Windows y macOS en GitHub Actions.
# - Al subir una etiqueta de versión (git tag v1.0.1 && git push origin v1.0.1) compila y publica
#   una versión (Release) con los instaladores listos para descargar.
# - También se puede lanzar a mano: Actions › "Compilar instaladores" › Run workflow
#   (en ese caso los instaladores quedan como artefactos de la ejecución).
name: Compilar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LiteCut-Studio-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

  mac:
    name: macOS (${{ matrix.arch }})
    # Los servidores Mac con chip Apple de GitHub suelen estar saturados; desde un Mac Intel
    # también se compila la versión arm64 (Apple Silicon) sin problema.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15-intel
          - arch: x64
            runner: macos-15-intel
    env:
      # Descarga Electron y FFmpeg de la arquitectura de destino (Apple Silicon o Intel).
      npm_config_arch: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: LiteCut-Studio-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar versión
    # Se publica aunque falle Mac (al menos queda Windows); con "Re-run failed jobs" se añade Mac luego.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' }}
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: LiteCut Studio ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
          make_latest: true
